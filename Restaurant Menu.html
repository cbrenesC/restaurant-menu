<!DOCTYPE html>
<html>
<head>
    <title>Restaurant Menu</title>
    <style>
        .menu-box {
            width: 400px;
            height: 550px;
            margin: 20px;
            padding: 30px;
            box-sizing: border-box;
            color: white;
            display: inline-block;
            vertical-align: top;
        }
        /* Using plain colors instead of web images to test */
        .breakfast { background-color: orange; border: 5px solid darkorange; }
        .lunch { background-color: green; border: 5px solid darkgreen; }
        .dinner { background-color: red; border: 5px solid darkred; }
    </style>
</head>
<body>

    <div class="menu-box breakfast">
        <h2>Breakfast</h2>
        <p>• Pancakes - $8<br>
            • Omelette - $10
        </p>
    </div>

    <div class="menu-box lunch">
        <h2>Lunch</h2>
        <p>• Burger - $11<br>
            • Salad - $9
        </p>
    </div>

    <div class="menu-box dinner">
        <h2>Dinner</h2>
        <p>• Steak - $22<br>
            • Pasta - $15
        </p>
    </div>

</body>
</html>
